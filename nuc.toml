# nuc.toml — Nucleor distribution reference sample
#
# NOTE: This file is kept as a compact schema reference for project
# manifests. The canonical per-project filename is `Nucleor.toml`
# (capitalized). `bin/nucleor.exe` reads `./Nucleor.toml`;
# `nuc init <name>` scaffolds `<name>/Nucleor.toml`; `nuc lock`
# writes `Nucleor.lock`.
#
# This sample is documentation. It is intentionally not a package
# manifest for the repository root.
#
# Manifest schema:
#   [package]
#     name           required, snake_case identifier
#     version        required, semver
#     edition        required, year string ("2026")
#     license        required, SPDX identifier
#     authors        optional, array of strings
#     description    optional, string
#     repository     optional, URL string
#
#   [dependencies]
#     <name> = "<version>" or { ... }
#
#   [dev-dependencies]   like dependencies, only built for `nuc test`
#   [build-dependencies] like dependencies, only built for build scripts
#
#   [features]
#     default = [...]
#     <feature> = [...]
#
#   [profile.<dev|release|safe-release|cert>]
#     opt_level     0..3
#     debug         bool
#     lto           bool
#     panic         "unwind" or "abort"

[package]
name = "nucleor-oss"
version = "1.1.0"
edition = "2026"
license = "Apache-2.0"
description = "Open-source distribution of the Nucleor self-hosted programming language"
repository = "https://github.com/APEXINTELORG/Nucleor"

[dependencies]
# Stdlib rods are available without [dependencies] entries — they
# import via `import "stdlib/rods/<name>.nr"`. Third-party deps once
# registry-backed dependencies are enabled.

[features]
default = ["showcase"]
showcase = []  # examples 13_test_framework, 14_csv_summary, 15_word_count, 16_histogram, 17_linecount, 18_benchmark + examples/showcase/{lorenz,vqe_h2,market_maker,wing_simulator}.nr
embedded = []  # stdlib/embedded/* + nostd profile

[profile.dev]
opt_level = 0
debug = true

[profile.release]
opt_level = 3
debug = false
lto = true

[profile.safe-release]
opt_level = 3
debug = false
panic = "abort"

[profile.cert]
opt_level = 2
debug = true
panic = "abort"
# Certification-oriented profile for bounded-runtime builds.
