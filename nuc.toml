# nuc.toml — Nucleor OSS distribution
#
# Reference manifest for v0.2.0 schema (RFC-0019). The minimal TOML
# parser shipped in v0.1.33 reads this file; the manifest validator
# (v0.1.39) checks structure.
#
# Schema (RFC-0019 §3.1):
#   [package]
#     name           required, snake_case identifier
#     version        required, semver
#     edition        required, year string ("2026")
#     license        required, SPDX identifier
#     authors        optional, array of strings (v0.4)
#     description    optional, string
#     repository     optional, URL string
#
#   [dependencies]
#     <name> = "<version>" or { ... }
#
#   [dev-dependencies]   like dependencies, only built for `nuc test`
#   [build-dependencies] like dependencies, only built for build scripts
#
#   [features]
#     default = [...]
#     <feature> = [...]
#
#   [profile.<dev|release|safe-release|cert>]
#     opt_level     0..3
#     debug         bool
#     lto           bool
#     panic         "unwind" or "abort"

[package]
name = "nucleor-oss"
version = "0.2.0"
edition = "2026"
license = "Apache-2.0"
description = "Open-source distribution of the Nucleor self-hosted programming language"
repository = "https://github.com/APEXINTELORG/Nucleor"

[dependencies]
# Stdlib rods are available without [dependencies] entries — they
# import via `import "stdlib/rods/<name>.nr"`. Third-party deps once
# RFC-0019 phase 2 (registry) ships.

[features]
default = ["showcase"]
showcase = []  # examples 13_test_framework, 14_csv_summary, 15_word_count, 16_histogram, 17_linecount, 18_benchmark + examples/showcase/{lorenz,vqe_h2,market_maker,wing_simulator}.nr
embedded = []  # v0.6: stdlib/embedded/* + nostd profile

[profile.dev]
opt_level = 0
debug = true

[profile.release]
opt_level = 3
debug = false
lto = true

[profile.safe-release]
opt_level = 3
debug = false
panic = "abort"

[profile.cert]
opt_level = 2
debug = true
panic = "abort"
# Heptane WCET analyzer enabled (RFC-0009)
