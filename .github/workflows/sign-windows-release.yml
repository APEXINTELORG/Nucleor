name: Sign Windows Release Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to sign
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: sign-windows-release-${{ github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  sign-windows:
    name: sign windows artifacts
    if: github.repository == 'APEXINTELORG/Nucleor'
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release-signing
    env:
      SM_HOST_VALUE: ${{ secrets.SM_HOST || vars.SM_HOST }}
      SM_API_KEY_VALUE: ${{ secrets.SM_API_KEY }}
      SM_CLIENT_CERT_FILE_B64_VALUE: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
      SM_CLIENT_CERT_PASSWORD_VALUE: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      SM_KEYPAIR_ALIAS_VALUE: ${{ secrets.SM_KEYPAIR_ALIAS || vars.SM_KEYPAIR_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Validate DigiCert signing configuration
        shell: pwsh
        run: |
          $required = @(
            "SM_HOST_VALUE",
            "SM_API_KEY_VALUE",
            "SM_CLIENT_CERT_FILE_B64_VALUE",
            "SM_CLIENT_CERT_PASSWORD_VALUE",
            "SM_KEYPAIR_ALIAS_VALUE"
          )
          $missing = New-Object System.Collections.Generic.List[string]
          foreach ($name in $required) {
            $value = (Get-Item -Path "env:$name" -ErrorAction SilentlyContinue).Value
            if ([string]::IsNullOrWhiteSpace($value)) {
              $missing.Add($name) | Out-Null
            }
          }
          if ($missing.Count -gt 0) {
            throw ("Missing DigiCert release-signing environment secret(s): {0}" -f ($missing -join ", "))
          }
          Write-Host "DigiCert signing configuration is present."

      - name: Validate source artifact inputs
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\check_windows_release_artifacts.ps1

      - name: Stage signing copies
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "target\release-signing\files"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath "bin\nucleor.exe" -Destination (Join-Path $stage "nucleor.exe") -Force
          Copy-Item -LiteralPath "bin\nucleor-lsp.exe" -Destination (Join-Path $stage "nucleor-lsp.exe") -Force
          Copy-Item -LiteralPath "bin\nucleor.exe.bootstrap" -Destination (Join-Path $stage "nucleor.exe.bootstrap.exe") -Force

      - name: Decode DigiCert client certificate
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "sm_client_cert.p12"
          $bytes = [System.Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64_VALUE)
          [System.IO.File]::WriteAllBytes($certPath, $bytes)
          "SM_CLIENT_CERT_FILE=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign staged Windows artifacts
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
          input: ${{ github.workspace }}\target\release-signing\files
          keypair-alias: ${{ env.SM_KEYPAIR_ALIAS_VALUE }}
          unsigned: true
          timestamp: true
          fail-fast: true
        env:
          SM_HOST: ${{ env.SM_HOST_VALUE }}
          SM_API_KEY: ${{ env.SM_API_KEY_VALUE }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ env.SM_CLIENT_CERT_PASSWORD_VALUE }}

      - name: Verify signed artifacts
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "target\release-signing\files"
          Move-Item -LiteralPath (Join-Path $stage "nucleor.exe.bootstrap.exe") -Destination (Join-Path $stage "nucleor.exe.bootstrap") -Force
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\check_windows_release_artifacts.ps1 `
            -RequireSigned `
            -ArtifactRoot "target\release-signing\files" `
            -ArtifactPaths "nucleor.exe,nucleor-lsp.exe,nucleor.exe.bootstrap" `
            -JsonOut "target\release-signing\windows-authenticode.json"
          $paths = @(
            "nucleor.exe",
            "nucleor-lsp.exe",
            "nucleor.exe.bootstrap"
          )
          $lines = foreach ($path in $paths) {
            $full = Join-Path $stage $path
            $hash = (Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $path
          }
          $lines | Set-Content -LiteralPath target\release-signing\windows-artifacts.sha256 -Encoding ASCII

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nucleor-windows-signed-${{ github.event.inputs.ref }}
          if-no-files-found: error
          path: |
            target/release-signing/files/nucleor.exe
            target/release-signing/files/nucleor-lsp.exe
            target/release-signing/files/nucleor.exe.bootstrap
            target/release-signing/windows-authenticode.json
            target/release-signing/windows-artifacts.sha256
