name: Sign Windows Release Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to sign
        required: true
        default: main
      version:
        description: Release version, without leading v
        required: true
        default: 1.1.0

permissions:
  contents: read

concurrency:
  group: sign-windows-release-${{ github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  sign-windows:
    name: sign windows artifacts
    if: github.repository == 'APEXINTELORG/Nucleor'
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release-signing
    env:
      SSL_COM_USERNAME_VALUE: ${{ secrets.SSL_COM_USERNAME }}
      SSL_COM_PASSWORD_VALUE: ${{ secrets.SSL_COM_PASSWORD }}
      SSL_COM_CREDENTIAL_ID_VALUE: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
      SSL_COM_TOTP_SECRET_VALUE: ${{ secrets.SSL_COM_TOTP_SECRET }}
      SSL_COM_ENVIRONMENT_NAME_VALUE: ${{ vars.SSL_COM_ENVIRONMENT_NAME || 'PROD' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Validate SSL.com signing configuration
        shell: pwsh
        run: |
          $required = [ordered]@{
            "SSL_COM_USERNAME_VALUE" = "SSL_COM_USERNAME"
            "SSL_COM_PASSWORD_VALUE" = "SSL_COM_PASSWORD"
            "SSL_COM_CREDENTIAL_ID_VALUE" = "SSL_COM_CREDENTIAL_ID"
            "SSL_COM_TOTP_SECRET_VALUE" = "SSL_COM_TOTP_SECRET"
          }
          $missing = New-Object System.Collections.Generic.List[string]
          foreach ($entry in $required.GetEnumerator()) {
            $value = (Get-Item -Path "env:$($entry.Key)" -ErrorAction SilentlyContinue).Value
            if ([string]::IsNullOrWhiteSpace($value)) {
              $missing.Add($entry.Value) | Out-Null
            }
          }
          if ($missing.Count -gt 0) {
            throw ("Missing SSL.com release-signing environment secret(s): {0}" -f ($missing -join ", "))
          }
          Write-Host "SSL.com signing configuration is present."

      - name: Validate source artifact inputs
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\check_windows_release_artifacts.ps1

      - name: Stage unsigned signing copies
        shell: pwsh
        run: |
          $root = Join-Path $PWD "target\release-signing"
          $unsigned = Join-Path $root "unsigned"
          $signed = Join-Path $root "signed"
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $unsigned, $signed | Out-Null
          Copy-Item -LiteralPath "bin\nucleor.exe" -Destination (Join-Path $unsigned "nucleor.exe") -Force
          Copy-Item -LiteralPath "bin\nucleor-lsp.exe" -Destination (Join-Path $unsigned "nucleor-lsp.exe") -Force
          Copy-Item -LiteralPath "bin\nucleor.exe.bootstrap" -Destination (Join-Path $unsigned "nucleor.exe.bootstrap.exe") -Force

      - name: Sign staged Windows artifacts
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b
        with:
          command: batch_sign
          username: ${{ env.SSL_COM_USERNAME_VALUE }}
          password: ${{ env.SSL_COM_PASSWORD_VALUE }}
          credential_id: ${{ env.SSL_COM_CREDENTIAL_ID_VALUE }}
          totp_secret: ${{ env.SSL_COM_TOTP_SECRET_VALUE }}
          dir_path: ${{ github.workspace }}\target\release-signing\unsigned
          output_path: ${{ github.workspace }}\target\release-signing\signed
          malware_block: "true"
          override: "false"
          clean_logs: "true"
          environment_name: ${{ env.SSL_COM_ENVIRONMENT_NAME_VALUE }}
          signing_method: v1

      - name: Verify signed artifacts
        shell: pwsh
        run: |
          $signed = Join-Path $PWD "target\release-signing\signed"
          $bootstrapExe = Join-Path $signed "nucleor.exe.bootstrap.exe"
          $bootstrapFinal = Join-Path $signed "nucleor.exe.bootstrap"
          if (Test-Path -LiteralPath $bootstrapExe) {
            Move-Item -LiteralPath $bootstrapExe -Destination $bootstrapFinal -Force
          }
          if (-not (Test-Path -LiteralPath $bootstrapFinal)) {
            throw "signed bootstrap artifact is missing: nucleor.exe.bootstrap"
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\check_windows_release_artifacts.ps1 `
            -RequireSigned `
            -ArtifactRoot "target\release-signing\signed" `
            -ArtifactPaths "nucleor.exe,nucleor-lsp.exe,nucleor.exe.bootstrap" `
            -JsonOut "target\release-signing\windows-authenticode.json"

      - name: Package signed Windows release
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\make_windows_release_package.ps1 `
            -Version "${{ github.event.inputs.version }}" `
            -ArtifactRoot "target\release-signing\signed" `
            -OutputDir "target\release" `
            -RequireSigned

      - name: Upload signed Windows package
        uses: actions/upload-artifact@v4
        with:
          name: nucleor-windows-signed-${{ github.event.inputs.version }}-${{ github.event.inputs.ref }}
          if-no-files-found: error
          path: |
            target/release/nucleor-v${{ github.event.inputs.version }}-windows-x86_64.zip
            target/release/nucleor-v${{ github.event.inputs.version }}-windows-x86_64.zip.sha256
            target/release/windows-artifacts.sha256
            target/release/windows-authenticode.json
            target/release/windows-release-summary.md
