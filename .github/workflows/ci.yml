name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM 18
        run: choco install llvm --version=18.1.8 -y --no-progress
        shell: powershell

      - name: Show toolchain versions
        run: |
          clang --version
          cargo --version
        shell: powershell

      - name: Build rust_bridge
        run: cargo build --release
        working-directory: stdlib/rods/rust_bridge
        shell: powershell

      - name: Run verification suite
        run: powershell.exe -ExecutionPolicy Bypass -File tools\verify.ps1
        shell: powershell
