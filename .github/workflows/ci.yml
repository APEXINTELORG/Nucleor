  rfc-link-check:
    name: RFC index sanity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify all RFCs in docs/rfcs/ are listed in README
        run: |
          missing=0
          for rfc in docs/rfcs/RFC-*.md; do
            base=$(basename "$rfc" .md)
            if ! grep -q "$base" docs/rfcs/README.md; then
              echo "::error::RFC $base is not listed in docs/rfcs/README.md"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ]
