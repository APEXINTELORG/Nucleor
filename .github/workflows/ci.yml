name: CI

on:
  push:
    branches:
      - main
      - "release/*"
      - "linux/r10-d3-*"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-windows:
    name: verify (windows)
    if: github.repository == 'APEXINTELORG/Nucleor-archive'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 18
        # windows-latest runner image ships LLVM 20.1.8 preinstalled.
        # Chocolatey refuses to downgrade to 18.1.8 without an explicit
        # opt-in flag, so the unflagged `choco install llvm
        # --version=18.1.8` fails with "A newer version of llvm
        # (v20.1.8) is already installed. Use --allow-downgrade or
        # --force to attempt to install older versions." in ~18s.
        #
        # We pin LLVM 18 across all platforms (Linux: apt-get install
        # clang-18 lld-18; bootstrap seed: bootstrap/nucleor_s1_seed.ll
        # is LLVM 18 IR; Linux perf baseline: tools/perf_baseline_linux.json
        # host.clang = "Ubuntu clang version 18.1.3"). Letting Windows
        # drift to LLVM 20 would create cross-platform toolchain skew
        # the self-host md5 fixed-point gate would silently mask.
        # The right move is `--allow-downgrade` to honor the existing
        # 18.1.8 pin; a coordinated LLVM-20 bump across all platforms
        # is a separate decision.
        run: choco install llvm --version=18.1.8 -y --no-progress --allow-downgrade
        shell: powershell
      - name: Show toolchain
        run: |
          clang --version
        shell: powershell
      - name: Bootstrap bin\nucleor.exe from IR seed
        # Mirrors verify-linux Step 2. The committed bin\nucleor.exe
        # in this repo is a developer convenience for fresh clones
        # without an LLVM toolchain — it drifts between commits and
        # by the time hosted CI runs it can be N commits stale
        # relative to compiler/*.nr source and tests/err/*.nr EXPECT
        # fixtures. Running verify.ps1 against the stale binary
        # surfaces as dozens of false-positive failures across the
        # err_*/T1.*/hazard-sweep clusters (see run 25650512190 on
        # 06a855a: 1486 PASS / 57 FAIL with the cluster signature
        # of a stale compiler vs. current fixtures).
        #
        # The deterministic fix is the same one Linux already uses:
        # rebuild bin\nucleor.exe from bootstrap\nucleor_s1_seed.ll
        # on the runner, in lockstep with the seed/fixtures HEAD
        # ships. `-Force` lets us overwrite the committed copy;
        # `-Run` flips bootstrap_windows.ps1 out of dry-run mode.
        # Fixed-point + stage-2 SHA equality is then exercised by
        # verify.ps1's own `self-host bootstrap fixpoint (stage-2)`
        # step, so we don't double-check it here.
        run: powershell.exe -ExecutionPolicy Bypass -File tools\bootstrap_windows.ps1 -Run -Force
        shell: powershell
      - name: Build rust_bridge (optional)
        run: cargo build --release
        working-directory: stdlib/rods/rust_bridge
        continue-on-error: true
        shell: powershell
      - name: Windows perf gate informational run (NOT for baseline lock)
        # GitHub-hosted Windows runners are 2-vCPU noisy VMs and are not
        # a stable baseline host. Keep this visible in CI, but do not let
        # hosted wall-clock jitter block the correctness verifier. Tight
        # cold/hot perf remains a local/pinned-runner release gate.
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\check_perf_regression.ps1
          $perfExit = $LASTEXITCODE
          if ($perfExit -ne 0) {
            Write-Warning "Hosted Windows perf gate exited $perfExit; this run is informational. Use the pinned Windows runner/local workstation for strict perf release gating."
          }
          exit 0
        shell: powershell
      - name: Run canonical verify.sh
        # verify.sh is the release-parity gate. verify.ps1 is retained in
        # the repo for Windows-native smoke/debug workflows but lags the
        # canonical Bash gate on newly added EXPECT/runtime-panic harness
        # behavior. GitHub-hosted Windows includes Git Bash, so run the
        # same gate we require locally.
        run: bash tools/verify.sh --no-color -j 4
        shell: powershell
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-windows
          path: |
            target/
            .nuc_cache/

  verify-linux:
    name: verify (linux)
    if: github.repository == 'APEXINTELORG/Nucleor-archive'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NUC_VERIFY_AGENT: gha-linux
      # Force POSIX /proc-based RSS sampling for memory-budget gates.
      # Hosted Ubuntu 24.04 ships pwsh preinstalled; without this the
      # gate's auto-detection would fall into tools/measure_peak_build.ps1
      # which calls Get-CimInstance Win32_Process (Windows-WMI-only) and
      # CoreCLR errors out with HRESULT 0x8007000E E_OUTOFMEMORY on the
      # memory-pressured runner. This var makes the gate go straight to
      # tools/run_capped.sh + the D1 compiler-only RSS split.
      NUC_VERIFY_FORCE_POSIX_RSS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Make tools/*.sh executable
        # actions/checkout@v4 preserves git index mode but some shell
        # scripts in tools/ were committed without the executable bit
        # (e.g. tools/bootstrap_linux.sh, tools/verify.sh on certain
        # historical branches). Set it explicitly here so any `./X.sh`
        # invocation in subsequent steps works, instead of patching
        # one script at a time as failures surface.
        run: chmod +x tools/*.sh
      - name: Install LLVM 18
        # Ubuntu 24.04 (noble) ships clang-18 + lld-18 in the default
        # repos. Use apt directly — avoids the apt.llvm.org dependency
        # that was failing fast (run 25643114414 verify-linux completed
        # in 3s, consistent with `wget https://apt.llvm.org/llvm.sh`
        # erroring before the rest of the step ran).
        #
        # Fall back to llvm.sh only if the apt route doesn't land
        # clang-18 on PATH, so we don't lose coverage on a future
        # runner image where the system package is missing.
        shell: bash
        run: |
          set -e
          sudo apt-get update -y
          if sudo apt-get install -y clang-18 lld-18; then
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100 || true
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100 || true
            echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          else
            echo "apt clang-18 unavailable; falling back to llvm.sh"
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 18
            echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          fi
          which clang || true
          clang --version || true
      - name: Step 1 — document runner (Ubuntu GHA, NOT pinned for perf)
        # Records host class as evidence. This runner is GHA-hosted Ubuntu,
        # which is correct for correctness gates (D2 of the handoff doc)
        # but explicitly NOT valid for perf baseline locks — those need a
        # pinned self-hosted runner. The perf gate below runs in
        # informational mode; baseline locks come from the pinned runner
        # job (commented stub at the bottom of this file).
        #
        # `set +e +o pipefail` because GHA default bash is `-eo pipefail`,
        # which makes `cmd | head -N` fail on SIGPIPE when head closes
        # stdin early. Step 1 is pure diagnostic — a partial dump must
        # not fail the whole verify-linux job.
        shell: bash
        run: |
          set +e +o pipefail
          {
            echo "## Step 1 runner — Ubuntu GHA (correctness gate, NOT pinned)"
            uname -a
            head -5 /etc/os-release 2>/dev/null || true
            clang --version 2>/dev/null | head -1 || true
            ldd --version 2>/dev/null | head -1 || true
            lscpu 2>/dev/null | grep -E "^Model name|^CPU\(s\):|^Architecture" || true
            head -2 /proc/meminfo 2>/dev/null || true
            echo "GitHub runner image: ubuntu-24.04 (hosted)"
          } | tee runner-info.txt
          true
      - name: Step 2 — bootstrap bin/nucleor from IR seed
        # T1.7 (v0.2.339): the Linux verify gate now produces its own
        # bin/nucleor by clang-linking bootstrap/nucleor_s1_seed.ll
        # against the platform-portable C runtime, then validating the
        # fixed-point invariant (stage-2 IR matches the seed). No
        # pre-built Linux binary is checked into the repo — the .ll
        # seed is the only artifact the bootstrap depends on.
        run: |
          chmod +x tools/bootstrap_linux.sh
          ./tools/bootstrap_linux.sh
      - name: Step 3 — version + ELF sanity
        run: |
          ./bin/nucleor --version
          file bin/nucleor
      - name: Step 4 — self-host fixed-point md5
        # Standalone invocation (T1.8 inside verify.sh re-runs this; the
        # standalone step gives a named CI status before verify.sh
        # starts so a regression is attributable cleanly).
        run: bash tools/check_self_host_md5.sh
      - name: Step 6 — perf gate doctor (D1 RSS-split ceilings present)
        # Step 6 of the handoff. Specifically gates the new D1 doctor
        # check `compiler-rss-ceilings` so a baseline that drops the
        # cold/hot compiler-only ceilings fails CI by name instead of
        # silently downgrading to warn-only at the gate.
        run: bash tools/check_perf_regression.sh --doctor
      - name: Perf gate informational run (NOT for baseline lock)
        # Informational only on hosted GHA — D2 of the handoff doc is
        # explicit that cloud GHA is too noisy for baseline locks. The
        # gate's exit code is captured for visibility, but CI does not
        # fail on cold/hot wall regressions here. The pinned-runner
        # job (commented stub below) is where wall-time regressions
        # become gating.
        #
        # `set +e +o pipefail` neutralizes GHA's default `-eo pipefail`
        # so the pipe-through-tee can't mask the real perf-gate exit
        # behind a tee failure. `${PIPESTATUS[0]}` captures the gate's
        # exit explicitly. Trailing `exit 0` is the explicit "this step
        # never gates" contract.
        shell: bash
        run: |
          set +e +o pipefail
          bash tools/check_perf_regression.sh \
              --cold-samples 2 \
              --hot-samples 2 \
              --budget-mb 800 \
              --warning-mb 600 \
              --timeout-sec 180 \
              --verbose | tee perf-informational.txt
          rc=${PIPESTATUS[0]}
          echo "informational perf gate exit: $rc (NOT gating on hosted GHA)"
          exit 0
      - name: Step 8 — full verify.sh
        # Internally re-exercises self-host md5 (T1.8) and the POSIX perf
        # regression monitor (which now strictly enforces the four D1
        # ceilings via the conservative placeholders in
        # tools/perf_baseline_linux.json).
        run: ./tools/verify.sh --no-color
      - name: Step 9 — rust_bridge POSIX ownership harness
        # Standalone — not wired into verify.sh per
        # tools/check_rust_bridge_ownership.sh. Doctor + self-test
        # always; the full --fixture all --iterations 20 acceptance run
        # is gated on PR/main merges (it builds the rust crate).
        run: |
          bash tools/check_rust_bridge_ownership.sh --doctor
          bash tools/check_rust_bridge_ownership.sh --self-test
          bash tools/check_rust_bridge_ownership.sh --fixture all --iterations 20
      - name: Upload R10-D3 transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-r10-d3-transcripts
          path: |
            runner-info.txt
            perf-informational.txt
            tools/verify_timings.gha-linux.csv
            target/_self_host_md5_stage1.build.log
            target/_self_host_md5_stage2.build.log
          if-no-files-found: ignore
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-linux
          path: |
            target/
            .nuc_cache/
            bin/

  # ---------------------------------------------------------------------
  # Linux perf baseline (pinned self-hosted) — STUB, not active.
  #
  # Activate by:
  #   1. Provisioning a stable Linux runner (physical box or pinned cloud
  #      VM, NOT a GHA hosted runner — D2 of the handoff doc).
  #   2. Registering it under APEXINTELORG/Nucleor-archive with labels
  #      `[self-hosted, linux, X64, nucleor-linux-perf-x64]`.
  #   3. Documenting host class (kernel, glibc, clang, CPU model, RAM,
  #      isolation strategy) in tools/perf_baseline_linux.json `host`
  #      block.
  #   4. Uncommenting the job below and removing the trailing `if: false`.
  #
